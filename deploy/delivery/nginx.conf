# Delivery plane: basemap PMTiles (Range), fonts, sprites, embed, per-release artifacts, environment pointers.
# Everything here is public by design; keys gate discovery via the API, not these bytes.
map $request_method $cors_ok { default 1; }

server {
    listen 80;
    server_name _;
    root /srv/delivery;
    sendfile on;
    tcp_nopush on;
    aio threads;
    open_file_cache max=2000 inactive=60s;
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css application/x-protobuf;
    gzip_min_length 1024;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since, If-Range" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag, Accept-Ranges" always;
    add_header X-Content-Type-Options "nosniff" always;

    if ($request_method = OPTIONS) { return 204; }

    location = /healthz { add_header Cache-Control "no-store"; return 200 "ok\n"; }

    # shared basemap archives: immutable, byte-range served, never gzip (already compressed tiles)
    location /base/ {
        gzip off;
        types { application/octet-stream pmtiles; text/plain sha256; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag, Accept-Ranges" always;
    }
    location /fonts/   { types { application/x-protobuf pbf; text/plain txt; } add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*" always; }
    location /sprites/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*" always; }
    location /gallery/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*" always; }
    location /source/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*" always; }

    # per-release artifacts: immutable
    location /t/ {
        types { application/json json; application/geo+json geojson; image/png png; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }
    # environment pointers: the only mutable tenant path
    location /p/ {
        types { application/json json; }
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
    }
    # embed loader (short cache) and versioned core (immutable)
    location = /embed/v1.js         { types { application/javascript js; } add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400"; add_header Access-Control-Allow-Origin "*" always; }
    location = /embed/v1/config.json { types { application/json json; } add_header Cache-Control "public, max-age=300"; add_header Access-Control-Allow-Origin "*" always; }
    location = /embed/version.json  { add_header Cache-Control "public, max-age=300"; }
    location /embed/v1/ {
        types { application/javascript js mjs; text/css css; application/json json map; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /uploads/ { return 403; }   # raw uploads are consumed by the worker only
    location / { try_files $uri =404; }
}
