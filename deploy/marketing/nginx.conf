server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://maps.truecanadianmaps.com; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; font-src 'self' https://maps.truecanadianmaps.com; connect-src 'self' https://maps.truecanadianmaps.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Every marketing URL is mutable, including the demo and version endpoint.
    # Keep all headers at server scope so asset locations inherit security headers.
    add_header Cache-Control "no-cache, must-revalidate" always;
    location ~* \.mjs$ { default_type application/javascript; try_files $uri =404; }
    # Source archives persist with published artifacts across marketing replacements.
    location /source/ { return 302 https://maps.truecanadianmaps.com$request_uri; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
